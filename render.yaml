services:
  - type: web
    name: ai-video-generator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: VIDEO_PROVIDER
        value: replicate
      - key: CLIP_SECONDS
        value: "5"
      - key: MAX_TOTAL_SECONDS
        value: "60"
      - key: REPLICATE_API_TOKEN
        sync: false
